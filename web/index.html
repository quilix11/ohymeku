<!DOCTYPE html>
<html lang="uk">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#160F29">
  <meta name="description" content="Ohymeku — практика англійської у розмовах з персонажами.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ohymeku">
  <script src="install.js" defer></script>
  <title>Ohymeku</title>
  <style>
    body { margin: 0; background: #160F29; color: #FFF3E1; }
    #startup {
      --splash-art: url("assets/assets/images/meku_splash_pass_portrait.webp");
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow: auto;
      font: 1rem system-ui, sans-serif;
      background:
        linear-gradient(#160F2999, #160F2916 48%, #160F29E6),
        var(--splash-art) center / cover no-repeat,
        #160F29;
    }
    #startup.is-ready { opacity: 0; transition: opacity 140ms ease-out; }
    .startup-layout {
      width: min(100%, 824px);
      margin: auto;
      display: grid;
      grid-template-areas: "brand" "stage" "copy";
      gap: 18px 32px;
      align-items: center;
    }
    .startup-stage {
      grid-area: stage;
      height: 246px;
      display: grid;
      place-items: center;
    }
    .startup-stage > * { grid-area: 1 / 1; }
    .startup-halo {
      width: min(100%, 246px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(#FFB3726D, transparent 69%);
    }
    .startup-stage picture { z-index: 1; }
    .startup-stage img { display: block; width: 231px; height: 231px; object-fit: contain; }
    .startup-brand { grid-area: brand; text-align: center; }
    .startup-brand h1 {
      margin: 4px 0 0;
      font: 700 2.625rem Georgia, serif;
    }
    .startup-tag {
      display: block;
      color: #FFCB88;
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .15em;
    }
    .startup-copy { grid-area: copy; }
    .startup-copy p { margin: 5px 0 0; color: #E5D8F4; }
    .startup-copy .startup-status { margin-top: 16px; font-size: .875rem; text-align: center; }
    .startup-bubble {
      position: relative;
      padding: 14px 18px;
      border: 1px solid #FFCB8842;
      border-radius: 20px;
      background: #261B3CF2;
    }
    .startup-bubble strong { display: block; margin-top: 5px; font-size: 1.2rem; }
    .startup-bubble::before {
      content: "";
      position: absolute;
      top: -6px;
      left: calc(50% - 7px);
      width: 14px;
      height: 14px;
      transform: rotate(45deg);
      background: #261B3C;
    }
    @media (min-width: 680px) {
      #startup { --splash-art: url("assets/assets/images/meku_splash_pass.webp"); }
      .startup-layout {
        grid-template-areas: "stage brand" "stage copy";
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .startup-brand { text-align: left; align-self: end; }
      .startup-brand h1 { font-size: 3.375rem; }
      .startup-copy { align-self: start; }
      .startup-copy .startup-status { text-align: left; }
      .startup-bubble::before { top: calc(50% - 7px); left: -7px; }
    }
    @media (max-height: 599px) {
      .startup-stage { height: 180px; }
      .startup-halo { width: min(100%, 180px); }
      .startup-stage img { width: 169px; height: 169px; }
    }
  </style>
</head>
<body>
  <div id="startup" role="status">
    <div class="startup-layout">
      <div class="startup-brand">
        <span class="startup-tag">АНГЛІЙСЬКА ПРИГОДА</span>
        <h1>Ohymeku</h1>
      </div>
      <div class="startup-stage" aria-hidden="true">
        <div class="startup-halo"></div>
        <picture>
          <source media="(prefers-reduced-motion: reduce)" srcset="assets/assets/images/meku/meku_happy.png">
          <img src="assets/assets/images/meku/meku_playful.png" width="231" height="231" alt="">
        </picture>
      </div>
      <div class="startup-copy">
        <div class="startup-bubble">
          <span class="startup-tag">MEKU</span>
          <strong lang="en">Hi! Ready for an adventure?</strong>
          <p>Привіт! Готовий до пригоди?</p>
        </div>
        <p class="startup-status">Завантажуємо пригоду…</p>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const splash = document.getElementById('startup');
      if (!splash || matchMedia('(prefers-reduced-motion: reduce)').matches) {
        splash?.remove();
        return;
      }
      // Keep the decoded HTML artwork visible while Flutter decodes its sprites.
      setTimeout(() => {
        splash.classList.add('is-ready');
        setTimeout(() => splash.remove(), 140);
      }, 480);
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
