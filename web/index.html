<!DOCTYPE html>
<html lang="uk">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F6F2EA">
  <meta name="description" content="Ohymeku — практика англійської у розмовах з персонажами.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ohymeku">
  <script src="install.js" defer></script>
  <title>Ohymeku</title>
  <style>
    body {
      --splash-bg: #F7F6FF;
      --splash-ink: #281968;
      --splash-stage: #EEEAFB;
      --splash-bubble: #E9E3FA;
      margin: 0;
      background: var(--splash-bg);
      color: var(--splash-ink);
    }
    #startup {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow: auto;
      font: 1rem system-ui, sans-serif;
    }
    .startup-layout {
      width: min(100%, 744px);
      margin: auto;
      display: grid;
      gap: 22px;
      align-items: center;
    }
    .startup-stage {
      height: 224px;
      display: grid;
      place-items: center;
      border-radius: 26px;
      background: var(--splash-stage);
    }
    .startup-stage > * { grid-area: 1 / 1; }
    .startup-halo {
      width: 162px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--splash-bg);
      opacity: .6;
    }
    .startup-stage picture { z-index: 1; }
    .startup-stage img { display: block; width: 186px; height: 186px; object-fit: contain; }
    .startup-copy h1 { margin: 0; font-size: 2rem; }
    .startup-copy p { margin: 4px 0 0; }
    .startup-copy .startup-status { margin-top: 16px; font-size: .875rem; }
    .startup-bubble {
      position: relative;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 18px;
      background: var(--splash-bubble);
    }
    .startup-bubble::before {
      content: "";
      position: absolute;
      top: -5px;
      left: 22px;
      width: 14px;
      height: 14px;
      transform: rotate(45deg);
      background: inherit;
    }
    @media (min-width: 640px) {
      .startup-layout { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
    }
    @media (prefers-color-scheme: dark) {
      body {
        --splash-bg: #191334;
        --splash-ink: #F7F6FF;
        --splash-stage: #2F2452;
        --splash-bubble: #3B2C63;
      }
    }
  </style>
</head>
<body>
  <div id="startup" role="status">
    <div class="startup-layout">
      <div class="startup-stage" aria-hidden="true">
        <div class="startup-halo"></div>
        <picture>
          <source media="(prefers-reduced-motion: reduce)" srcset="assets/assets/images/meku/meku_happy.png">
          <img src="assets/assets/images/meku/meku_playful.png" width="186" height="186" alt="">
        </picture>
      </div>
      <div class="startup-copy">
        <h1>Ohymeku</h1>
        <p>Англійська з Meku</p>
        <div class="startup-bubble">
          <strong lang="en">Hi! Ready for an adventure?</strong>
          <p>Привіт! Готовий до пригоди?</p>
        </div>
        <p class="startup-status">Завантажуємо пригоду…</p>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('startup')?.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
