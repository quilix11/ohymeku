name: dialect_duel
description: "DialectDuel - Conversational RPG for English speaking practice"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # AI / HTTP
  http: ^1.2.1
  # Speech-to-Text
  speech_to_text: ^7.0.0
  # Text-to-Speech
  flutter_tts: ^4.2.0
  # Env variables
  flutter_dotenv: ^5.2.1
  # Animations
  flutter_animate: ^4.5.0
  # Local storage
  shared_preferences: ^2.3.2
  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/sounds/
