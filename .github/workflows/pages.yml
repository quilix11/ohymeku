name: Deploy Ohymeku to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Prepare public build without API credentials
        run: |
          printf '# Public build: enter your own Gemini key in Settings.\n' > .env
          mkdir -p assets/sounds
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Test app gateway integration
        run: flutter test --no-pub test/gemini_gateway_test.dart --dart-define=GEMINI_GATEWAY_URL=https://gateway.example
      - name: Test shared gateway
        run: node --test gateway/worker.test.mjs
      - name: Build project Pages site
        env:
          GEMINI_GATEWAY_URL: ${{ vars.GEMINI_GATEWAY_URL }}
        run: flutter build web --no-pub --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/" --dart-define="GEMINI_GATEWAY_URL=$GEMINI_GATEWAY_URL"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
